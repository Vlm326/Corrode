[package]
name = "corrode"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_toml = "0.0.1"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"]}  
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "macros", "rt-multi-thread"] }
toml = "1.1.6"
